name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest
      - name: Diagnose and apply import formatting (temporary)
        run: |
          ruff check --fix tests/test_workflow.py tests/test_workflow_pipeline.py
          git diff -- tests/test_workflow.py tests/test_workflow_pipeline.py
          ruff check .
